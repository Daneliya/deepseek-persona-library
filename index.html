<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#0b1220">
  <title>大肥鱼人设库 · 管理台</title>
  <style>
    :root{--bg:#f4f8fc;--panel:#fff;--panel2:#f7fafc;--glass:#ffffffde;--line:#dce7ef;--text:#16283a;--muted:#6c8397;--soft:#405b70;--cyan:#20aeb9;--blue:#397ee8;--gold:#e9a92d;--danger:#e94f64;--card1:#fff;--card2:#f9fcff;--nav:#eaf5f7;--input:#fff;--shadow:0 18px 55px #2f59731c;--backdrop:#18364c66;color-scheme:light}
    html[data-theme="dark"]{--bg:#07101d;--panel:#0d1929;--panel2:#111f31;--glass:#0a1524e8;--line:#20334a;--text:#edf7ff;--muted:#8ea7bd;--soft:#b8c9d8;--cyan:#55d9df;--blue:#63a8ff;--gold:#ffc96b;--danger:#ff7184;--card1:#102034;--card2:#0b1625;--nav:#162c40;--input:#07111e;--shadow:0 18px 55px #0007;--backdrop:#02070dbd;color-scheme:dark}
    @media(prefers-color-scheme:dark){html[data-theme="system"]{--bg:#07101d;--panel:#0d1929;--panel2:#111f31;--glass:#0a1524e8;--line:#20334a;--text:#edf7ff;--muted:#8ea7bd;--soft:#b8c9d8;--cyan:#55d9df;--blue:#63a8ff;--gold:#ffc96b;--danger:#ff7184;--card1:#102034;--card2:#0b1625;--nav:#162c40;--input:#07111e;--shadow:0 18px 55px #0007;--backdrop:#02070dbd;color-scheme:dark}}
    *{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 12% -8%,color-mix(in srgb,var(--cyan) 18%,transparent) 0,transparent 34%),radial-gradient(circle at 92% 18%,color-mix(in srgb,var(--blue) 12%,transparent) 0,transparent 28%),var(--bg);color:var(--text);font:14px/1.55 ui-sans-serif,system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;min-height:100vh;transition:background .25s,color .25s}
    button,input,select,textarea{font:inherit}button{cursor:pointer}.hidden{display:none!important}
    .shell{max-width:1500px;margin:auto;padding:28px}.top{display:flex;gap:20px;justify-content:space-between;align-items:flex-end;margin-bottom:22px}.brand small{display:block;color:var(--cyan);font-weight:800;letter-spacing:.18em}.brand h1{font-size:clamp(28px,4vw,48px);line-height:1;margin:8px 0}.brand p{margin:0;color:var(--muted)}
    .statline{display:flex;gap:10px;flex-wrap:wrap}.stat{padding:10px 14px;border:1px solid var(--line);background:var(--glass);box-shadow:var(--shadow);border-radius:14px;color:var(--muted)}.stat b{color:var(--text);font-size:18px;margin-right:5px}
    .toolbar{position:sticky;top:10px;z-index:10;display:grid;grid-template-columns:minmax(220px,1fr) repeat(6,auto);gap:10px;padding:12px;border:1px solid var(--line);border-radius:18px;background:var(--glass);backdrop-filter:blur(18px);box-shadow:var(--shadow)}
    .search{display:flex;align-items:center;gap:10px;padding:0 14px;background:var(--panel2);border:1px solid var(--line);border-radius:12px}.search input{width:100%;background:none;border:0;outline:0;color:var(--text);padding:10px 0}.control,.btn{border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:12px;padding:10px 14px}.btn:hover,.control:hover{border-color:var(--cyan);transform:translateY(-1px)}.btn.primary{border:0;background:linear-gradient(135deg,var(--cyan),var(--blue));color:white;font-weight:900}.btn.danger{color:var(--danger)}.btn.ghost{background:transparent}.file{position:relative;overflow:hidden}.file input{position:absolute;inset:0;opacity:0;cursor:pointer}
    .layout{display:grid;grid-template-columns:220px minmax(0,1fr);gap:18px;margin-top:18px}.side{align-self:start;position:sticky;top:88px;border:1px solid var(--line);background:var(--glass);box-shadow:var(--shadow);border-radius:18px;padding:12px}.side h3{font-size:12px;text-transform:uppercase;letter-spacing:.14em;color:var(--muted);margin:8px 10px}.nav{display:flex;flex-direction:column;gap:5px}.nav button{border:0;background:transparent;color:var(--muted);padding:10px 12px;border-radius:11px;text-align:left;display:flex;justify-content:space-between}.nav button:hover{background:var(--panel2);color:var(--text)}.nav button.active{background:var(--nav);color:var(--cyan);font-weight:800}.note{border-top:1px solid var(--line);margin-top:12px;padding:14px 10px 4px;color:var(--muted);font-size:12px}
    .content-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:4px 2px 14px}.content-head h2{margin:0;font-size:18px}.content-head span{color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}.card{position:relative;min-height:220px;border:1px solid var(--line);border-radius:18px;background:linear-gradient(145deg,var(--card1),var(--card2));box-shadow:0 8px 25px #2b577014;padding:18px;display:flex;flex-direction:column;transition:.2s ease;overflow:hidden}.card.selected{outline:2px solid var(--cyan);outline-offset:2px}.card:before{content:"";position:absolute;right:-55px;top:-55px;width:110px;height:110px;border-radius:50%;background:var(--accent,#55d9df);filter:blur(45px);opacity:.15}.card:hover{transform:translateY(-3px);border-color:var(--cyan);box-shadow:var(--shadow)}.card-top{display:flex;justify-content:space-between;gap:12px}.card-check{accent-color:var(--cyan);width:17px;height:17px;margin:2px 0 0}.card-title{display:flex;gap:9px;align-items:flex-start}.card h3{font-size:18px;line-height:1.35;margin:0}.star{border:0;background:none;color:#91a6b7;font-size:22px;line-height:1;padding:0}.star.on{color:var(--gold)}.tags{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0}.tag{font-size:11px;padding:4px 8px;border:1px solid var(--line);border-radius:999px;color:var(--muted);background:var(--panel2)}.desc{color:var(--soft);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;min-height:65px}.meta{display:flex;justify-content:space-between;gap:8px;color:var(--muted);font-size:12px;margin-top:auto;padding-top:16px}.card-actions{display:flex;gap:7px;margin-top:12px}.card-actions .btn{flex:1;padding:8px}.empty{grid-column:1/-1;padding:70px 20px;text-align:center;border:1px dashed var(--line);border-radius:18px;color:var(--muted)}.batch{display:none;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:14px;padding:10px 12px;border:1px solid var(--line);border-radius:14px;background:var(--glass);box-shadow:var(--shadow)}.batch.show{display:flex}.batch strong{color:var(--cyan)}
    dialog{width:min(920px,calc(100% - 28px));max-height:90vh;padding:0;border:1px solid var(--line);border-radius:22px;background:var(--panel);color:var(--text);box-shadow:var(--shadow)}dialog::backdrop{background:var(--backdrop);backdrop-filter:blur(5px)}.modal-head{position:sticky;top:0;z-index:2;display:flex;justify-content:space-between;align-items:center;padding:18px 22px;border-bottom:1px solid var(--line);background:var(--glass);backdrop-filter:blur(15px)}.modal-head h2{margin:0;font-size:20px}.close{width:36px;height:36px;border:1px solid var(--line);border-radius:10px;background:var(--panel2);color:var(--text);font-size:20px}.modal-body{padding:22px}.detail-desc{font-size:16px;color:var(--soft)}.prompt{white-space:pre-wrap;word-break:break-word;padding:18px;background:var(--input);border:1px solid var(--line);border-radius:14px;max-height:52vh;overflow:auto;color:var(--text)}.modal-actions{display:flex;gap:8px;justify-content:flex-end;padding:16px 22px;border-top:1px solid var(--line)}
    .form{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field{display:flex;flex-direction:column;gap:6px}.field.full{grid-column:1/-1}.field label{color:var(--muted);font-size:12px}.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);border-radius:12px;background:var(--input);color:var(--text);padding:11px 12px;outline:none}.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--cyan);box-shadow:0 0 0 3px color-mix(in srgb,var(--cyan) 15%,transparent)}.field textarea{min-height:90px;resize:vertical}.field textarea.prompt-edit{min-height:290px}
    .toast{position:fixed;left:50%;bottom:28px;z-index:99;transform:translate(-50%,20px);opacity:0;pointer-events:none;background:var(--text);color:var(--bg);font-weight:800;padding:11px 18px;border-radius:999px;transition:.25s;box-shadow:var(--shadow)}.toast.show{opacity:1;transform:translate(-50%,0)}
    @media(max-width:850px){.shell{padding:18px}.top{align-items:flex-start;flex-direction:column}.toolbar{grid-template-columns:1fr 1fr;top:6px}.search{grid-column:1/-1}.layout{grid-template-columns:1fr}.side{position:static}.nav{flex-direction:row;overflow:auto}.nav button{min-width:max-content;gap:12px}.side h3,.note{display:none}.form{grid-template-columns:1fr}.field.full{grid-column:auto}}
    @media(max-width:520px){.toolbar{grid-template-columns:1fr 1fr}.toolbar .btn{padding:9px}.grid{grid-template-columns:1fr}.statline{display:none}}
  </style>
</head>
<body>
  <main class="shell">
    <header class="top"><div class="brand"><small>PERSONA ARCHIVE</small><h1>大肥鱼人设库</h1><p>把灵感养在云海里。检索、整理、编辑和备份你的角色设定。</p></div><div class="statline"><span class="stat"><b id="totalStat">—</b>人设</span><span class="stat"><b id="favStat">0</b>收藏</span><span class="stat"><b id="customStat">0</b>我的创作</span><span class="stat"><b id="promptStat">—</b>完整提示词</span></div></header>
    <section class="toolbar" aria-label="管理工具栏">
      <label class="search">⌕<input id="search" type="search" placeholder="搜索标题、作者、简介或提示词…"></label>
      <select id="sort" class="control" aria-label="排序"><option value="updated">最近更新</option><option value="title">标题排序</option><option value="words">提示词长度</option></select>
      <select id="theme" class="control" aria-label="页面主题"><option value="light">☀ 云海白</option><option value="dark">☾ 深海蓝</option><option value="system">◐ 跟随系统</option></select>
      <label class="btn file">选择 JSON<input id="importFile" type="file" accept="application/json,.json"></label>
      <button class="btn primary" id="addBtn">＋ 新建人设</button>
    </section>
    <div class="layout">
      <aside class="side"><h3>资料视图</h3><nav class="nav" id="nav"></nav><div class="note">编辑与收藏自动保存在当前浏览器。建议定期导出 JSON 备份。</div></aside>
      <section><div class="content-head"><h2 id="viewTitle">全部人设</h2><span id="resultCount">加载中…</span></div><div class="batch" id="batch"><strong id="selectedCount">已选 0 条</strong><button class="btn" id="selectVisible">选择当前结果</button><button class="btn" id="batchFav">批量收藏</button><button class="btn danger" id="batchDelete">批量删除</button><button class="btn ghost" id="clearSelected">取消选择</button><span style="flex:1"></span><button class="btn ghost" id="clearFilters">清除筛选</button></div><div class="grid" id="grid"><div class="empty">正在潜入资料云海…</div></div></section>
    </div>
  </main>
  <dialog id="detailModal"><div class="modal-head"><h2 id="detailTitle"></h2><button class="close" data-close="detailModal">×</button></div><div class="modal-body"><div class="tags" id="detailTags"></div><p class="detail-desc" id="detailDesc"></p><pre class="prompt" id="detailPrompt"></pre></div><div class="modal-actions"><button class="btn" id="copyPrompt">复制提示词</button><button class="btn" id="duplicatePersona">创建副本</button><button class="btn primary" id="editFromDetail">编辑人设</button></div></dialog>
  <dialog id="editModal"><div class="modal-head"><h2 id="editTitle">新建人设</h2><button class="close" data-close="editModal">×</button></div><form id="editForm"><div class="modal-body form"><input type="hidden" id="editId"><div class="field"><label for="title">标题 *</label><input id="title" required maxlength="100"></div><div class="field"><label for="author">作者</label><input id="author" maxlength="60"></div><div class="field"><label for="category">分类</label><select id="category"><option value="companion">陪伴型</option><option value="roleplay">角色扮演</option><option value="utility">实用助手</option><option value="custom">自定义</option></select></div><div class="field"><label for="updated">更新时间</label><input id="updated" type="date"></div><div class="field full"><label for="description">简介</label><textarea id="description" maxlength="1000"></textarea></div><div class="field full"><label for="promptText">完整提示词</label><textarea id="promptText" class="prompt-edit"></textarea></div></div><div class="modal-actions"><button type="button" class="btn danger hidden" id="deleteBtn">删除</button><span style="flex:1"></span><button type="button" class="btn" data-close="editModal">取消</button><button type="submit" class="btn primary">保存</button></div></form></dialog>
  <div class="toast" id="toast"></div>
  <script>
  (()=>{
    const KEY='bigfish-persona-manager-v1',THEME_KEY='bigfish-persona-theme',DATA_URL='personas.json',cats={companion:'陪伴型',roleplay:'角色扮演',utility:'实用助手',custom:'自定义'};
    const state={items:[],fav:new Set(),selected:new Set(),view:'all',query:'',activeId:null};
    const $=s=>document.querySelector(s), grid=$('#grid'), modal=$('#detailModal'), edit=$('#editModal');
    const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
    function notify(s){let t=$('#toast');t.textContent=s;t.classList.add('show');clearTimeout(notify.t);notify.t=setTimeout(()=>t.classList.remove('show'),1600)}
    function normalize(d){return{id:d.id||'persona-'+crypto.randomUUID(),title:d.title??d.t??'未命名人设',author:d.author??d.a??'我',category:d.category??d.c??'custom',desc:d.desc??d.d??'',updatedAt:d.updatedAt??d.u??new Date().toISOString().slice(0,10),prompt:d.prompt??d.p??'',custom:!!d.custom}}
    async function loadSeed(){
      let saved;try{saved=JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){}
      if(saved?.items?.length){state.items=saved.items.map(normalize);state.fav=new Set(saved.favorites||[]);ready();return}
      try{
        const response=await fetch(DATA_URL,{cache:'no-store'});
        if(!response.ok)throw new Error(`HTTP ${response.status}`);
        const data=await response.json(),raw=Array.isArray(data)?data:data.items;
        if(!Array.isArray(raw)||!raw.length)throw new Error('JSON 数据格式不正确');
        state.items=raw.map(normalize);persist();ready();notify(`已读取 ${raw.length} 条 JSON 数据`)
      }catch(e){
        grid.innerHTML='<div class="empty"><strong>浏览器未能自动读取 JSON</strong><br><br>直接双击打开时，浏览器可能会拦截本地文件读取。请点击下方按钮选择同目录中的「personas.json」。<br><br><button class="btn primary" data-pick-json>选择 JSON 文件</button></div>';
        $('#resultCount').textContent='等待选择数据文件'
      }
    }
    function persist(){localStorage.setItem(KEY,JSON.stringify({items:state.items,favorites:[...state.fav]}))}
    function ready(){renderNav();render();$('#totalStat').textContent=state.items.length;$('#promptStat').textContent=state.items.filter(x=>x.prompt).length;$('#favStat').textContent=state.fav.size;$('#customStat').textContent=state.items.filter(x=>x.custom).length}
    function renderNav(){const counts=Object.fromEntries(Object.keys(cats).map(c=>[c,state.items.filter(x=>x.category===c).length]));let views=[['all','全部人设',state.items.length],['favorites','★ 我的收藏',state.fav.size],['mine','我的创作',state.items.filter(x=>x.custom).length],...Object.entries(cats).map(([k,v])=>[k,v,counts[k]])];$('#nav').innerHTML=views.map(([k,v,n])=>`<button data-view="${k}" class="${state.view===k?'active':''}"><span>${v}</span><span>${n}</span></button>`).join('')}
    function filtered(){let q=state.query.toLowerCase(),a=state.items.filter(x=>(state.view==='all'||state.view==='favorites'&&state.fav.has(x.id)||state.view==='mine'&&x.custom||x.category===state.view)&&(!q||[x.title,x.author,x.desc,x.prompt].join(' ').toLowerCase().includes(q)));let sort=$('#sort').value;return a.sort(sort==='title'?(a,b)=>a.title.localeCompare(b.title,'zh-CN'):sort==='words'?(a,b)=>b.prompt.length-a.prompt.length:(a,b)=>String(b.updatedAt).localeCompare(String(a.updatedAt)))}
    function render(){let a=filtered();$('#resultCount').textContent=`显示 ${a.length} / ${state.items.length} 条`;$('#viewTitle').textContent=state.view==='all'?'全部人设':state.view==='favorites'?'我的收藏':state.view==='mine'?'我的创作':cats[state.view];grid.innerHTML=a.length?a.map(card).join(''):'<div class="empty">这片水域还没有人设。换个筛选条件，或新建一条吧。</div>';renderBatch()}
    function renderBatch(){$('#selectedCount').textContent=`已选 ${state.selected.size} 条`;$('#batch').classList.toggle('show',state.selected.size>0||state.query||state.view!=='all')}
    function card(x){let color={companion:'#f48fb1',roleplay:'#a78bfa',utility:'#20b9c4',custom:'#4e8ff1'}[x.category];return `<article class="card ${state.selected.has(x.id)?'selected':''}" style="--accent:${color}"><div class="card-top"><div class="card-title"><input class="card-check" type="checkbox" data-select="${x.id}" ${state.selected.has(x.id)?'checked':''} aria-label="选择 ${esc(x.title)}"><h3>${esc(x.title)}</h3></div><button class="star ${state.fav.has(x.id)?'on':''}" data-star="${x.id}" title="收藏">★</button></div><div class="tags"><span class="tag">${cats[x.category]||'自定义'}</span><span class="tag">${x.prompt.length.toLocaleString()} 字</span>${x.custom?'<span class="tag">我的创作</span>':''}</div><div class="desc">${esc(x.desc||'暂无简介')}</div><div class="meta"><span>${esc(x.author)}</span><span>${esc(x.updatedAt)}</span></div><div class="card-actions"><button class="btn" data-open="${x.id}">查看</button><button class="btn ghost" data-edit="${x.id}">编辑</button></div></article>`}
    function openDetail(id){let x=state.items.find(v=>v.id===id);if(!x)return;state.activeId=id;$('#detailTitle').textContent=x.title;$('#detailTags').innerHTML=`<span class="tag">${cats[x.category]}</span><span class="tag">${esc(x.author)}</span><span class="tag">${x.prompt.length.toLocaleString()} 字</span>`;$('#detailDesc').textContent=x.desc||'暂无简介';$('#detailPrompt').textContent=x.prompt||'暂无提示词';modal.showModal()}
    function openEdit(id){let x=id?state.items.find(v=>v.id===id):null;state.activeId=id||null;$('#editTitle').textContent=x?'编辑人设':'新建人设';$('#editId').value=x?.id||'';$('#title').value=x?.title||'';$('#author').value=x?.author||'我';$('#category').value=x?.category||'custom';$('#updated').value=x?.updatedAt||new Date().toISOString().slice(0,10);$('#description').value=x?.desc||'';$('#promptText').value=x?.prompt||'';$('#deleteBtn').classList.toggle('hidden',!x);if(modal.open)modal.close();edit.showModal();if(!x)setTimeout(()=>$('#title').focus(),50)}
    function refresh(){persist();renderNav();ready()}
    $('#nav').addEventListener('click',e=>{let b=e.target.closest('[data-view]');if(!b)return;state.view=b.dataset.view;renderNav();render()});
    grid.addEventListener('click',e=>{if(e.target.hasAttribute('data-pick-json')){$('#importFile').click();return}let id=e.target.dataset.select||e.target.dataset.star||e.target.dataset.open||e.target.dataset.edit;if(!id)return;if(e.target.dataset.select){state.selected.has(id)?state.selected.delete(id):state.selected.add(id);render()}else if(e.target.dataset.star){state.fav.has(id)?state.fav.delete(id):state.fav.add(id);refresh()}else if(e.target.dataset.edit)openEdit(id);else openDetail(id)});
    $('#search').addEventListener('input',e=>{state.query=e.target.value.trim();render()});$('#sort').addEventListener('change',render);$('#addBtn').onclick=()=>openEdit();$('#editFromDetail').onclick=()=>openEdit(state.activeId);
    $('#copyPrompt').onclick=async()=>{let x=state.items.find(v=>v.id===state.activeId);try{await navigator.clipboard.writeText(x?.prompt||'');notify('提示词已复制')}catch(e){notify('复制失败，请手动选择') }};
    $('#duplicatePersona').onclick=()=>{let x=state.items.find(v=>v.id===state.activeId);if(!x)return;let copy=normalize({...x,id:'persona-'+crypto.randomUUID(),title:x.title+' · 副本',updatedAt:new Date().toISOString().slice(0,10),custom:true});state.items.unshift(copy);modal.close();refresh();openEdit(copy.id);notify('副本已创建')};
    document.addEventListener('click',e=>{let id=e.target.dataset.close;if(id)document.getElementById(id).close()});
    $('#editForm').addEventListener('submit',e=>{e.preventDefault();let id=$('#editId').value||'persona-'+crypto.randomUUID(),old=state.items.find(x=>x.id===id),x=normalize({id,title:$('#title').value.trim(),author:$('#author').value.trim()||'我',category:$('#category').value,updatedAt:$('#updated').value,desc:$('#description').value.trim(),prompt:$('#promptText').value,custom:true});old?Object.assign(old,x):state.items.unshift(x);edit.close();refresh();notify(old?'人设已更新':'人设已创建')});
    $('#deleteBtn').onclick=()=>{let x=state.items.find(v=>v.id===state.activeId);if(!x||!confirm(`确定删除「${x.title}」吗？\n删除后可通过重新导入备份恢复。`))return;state.items=state.items.filter(v=>v.id!==x.id);state.fav.delete(x.id);edit.close();refresh();notify('人设已删除')};
    $('#selectVisible').onclick=()=>{filtered().forEach(x=>state.selected.add(x.id));render()};$('#clearSelected').onclick=()=>{state.selected.clear();render()};
    $('#batchFav').onclick=()=>{state.selected.forEach(id=>state.fav.add(id));refresh();notify(`已收藏 ${state.selected.size} 条人设`)};
    $('#batchDelete').onclick=()=>{let n=state.selected.size;if(!n||!confirm(`确定删除选中的 ${n} 条人设吗？此操作不可撤销。`))return;state.items=state.items.filter(x=>!state.selected.has(x.id));state.selected.forEach(id=>state.fav.delete(id));state.selected.clear();refresh();notify(`已删除 ${n} 条人设`)};
    $('#clearFilters').onclick=()=>{state.view='all';state.query='';$('#search').value='';$('#sort').value='updated';renderNav();render()};
    $('#importFile').addEventListener('change',async e=>{let f=e.target.files[0];if(!f)return;try{let d=JSON.parse(await f.text()),items=Array.isArray(d)?d:d.items;if(!Array.isArray(items))throw Error();if(!confirm(`将导入 ${items.length} 条人设并替换当前资料，是否继续？`))return;state.items=items.map(normalize);state.fav=new Set(d.favorites||[]);refresh();notify('导入成功')}catch(err){notify('无法识别这个 JSON 文件')}finally{e.target.value=''}});
    const exportBtn=document.createElement('button');exportBtn.className='btn';exportBtn.textContent='导出';exportBtn.onclick=()=>{let blob=new Blob([JSON.stringify({version:1,exportedAt:new Date().toISOString(),total:state.items.length,favorites:[...state.fav],items:state.items},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`personas-backup-${new Date().toISOString().slice(0,10)}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);notify('备份已导出')};$('#importFile').closest('label').before(exportBtn);
    const savedTheme=localStorage.getItem(THEME_KEY)||'light';$('#theme').value=savedTheme;document.documentElement.dataset.theme=savedTheme;$('#theme').addEventListener('change',e=>{document.documentElement.dataset.theme=e.target.value;localStorage.setItem(THEME_KEY,e.target.value);document.querySelector('meta[name="theme-color"]').content=e.target.value==='dark'?'#0b1220':'#f4f8fc';notify('主题已切换')});
    loadSeed();
  })();
  </script>
</body>
</html>
